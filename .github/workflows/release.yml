name: Release evidence

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Build deterministic bundle and checksum manifest
        run: python tools/build_release.py

      - name: Verify checksum manifest
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iot-ids-capstone-${{ github.sha }}
          path: |
            dist/iot-ids-capstone.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Attest release bundle provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/iot-ids-capstone.tar.gz

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/iot-ids-capstone.tar.gz dist/SHA256SUMS
          --verify-tag --generate-notes
