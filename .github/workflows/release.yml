name: Release evidence

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Build deterministic bundle and checksum manifest
        run: python tools/build_release.py

      - name: Verify checksum manifest
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iot-ids-capstone-${{ github.sha }}
          path: |
            dist/iot-ids-capstone.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Attest release bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/iot-ids-capstone.tar.gz

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/iot-ids-capstone.tar.gz dist/SHA256SUMS
          --verify-tag --generate-notes
